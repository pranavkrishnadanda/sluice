# Local services for Sluice. Start with `make up` (reads secrets from backend/.env).
# Host ports are bound to 127.0.0.1 only and avoid 5432/8000/3000/3100.
# Each service receives only the variables it needs (interpolated from the --env-file), not the
# whole env file; `:?` makes a missing required secret fail fast at `compose up`.
name: sluice

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: sluice
      POSTGRES_DB: sluice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sluice -d sluice"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 512m
    restart: unless-stopped

  redis:
    image: redis:8.8.4
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in backend/.env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in backend/.env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "http://localhost:59001"
      RUSTFS_VOLUMES: /data
      RUSTFS_OBS_LOG_DIRECTORY: ""
      WAREHOUSE_BUCKET: ${WAREHOUSE_BUCKET:-sluice-warehouse}
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - rustfsdata:/data
    # Healthy = API up AND warehouse bucket present. The check creates the bucket when missing
    # (idempotent), so `up --wait` returns only once the bucket exists. A one-shot init container
    # would make `up --wait` exit 1 when it finishes. curl signs the S3 calls with SigV4.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null http://localhost:9000/health &&
          { curl -fsS -o /dev/null -I --aws-sigv4 aws:amz:us-east-1:s3
          --user "$$RUSTFS_ACCESS_KEY:$$RUSTFS_SECRET_KEY" "http://localhost:9000/$$WAREHOUSE_BUCKET" ||
          curl -fsS -o /dev/null -X PUT --aws-sigv4 aws:amz:us-east-1:s3
          --user "$$RUSTFS_ACCESS_KEY:$$RUSTFS_SECRET_KEY" "http://localhost:9000/$$WAREHOUSE_BUCKET"; }
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    mem_limit: 512m
    restart: unless-stopped

  # LLM proxy. In profile `llm` until Task 2 adds backend/litellm/config.yaml.
  litellm:
    profiles: ["llm"]
    image: ghcr.io/berriai/litellm:v1.106.5
    command: ["--port", "4000"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in backend/.env}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "127.0.0.1:54000:4000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 768m
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  rustfsdata:
