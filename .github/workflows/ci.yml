name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv no longer publishes moving major tags; v10.3.3 is the latest v10 release.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      # Rebuild both splits from scratch, check them against LOCK.json, re-run the full rules
      # eval, then render RESULTS.md from that fresh rules run plus the committed summaries in
      # evals/published/ (agent and subset rows, which need model keys; see its README). Fail if
      # the published RESULTS.md would change (the run-date footer line is ignored).
      - name: Reproduce published results
        run: |
          make cases eval-rules results
          git diff --exit-code -I '^- Run date \(UTC\): ' -- evals/RESULTS.md
