# LiteLLM proxy config (ghcr.io/berriai/litellm:v1.106.5), mounted by compose.yaml.
# Clients ask for a *tier* ("strong" / "small"). Each tier is a model group with one deployment;
# on failure the router falls back to the "<tier>-fallback" group.
#
# Model choice (read 2026-10-28):
#   https://console.groq.com/docs/models: production models are openai/gpt-oss-120b and
#     openai/gpt-oss-20b ($0.15/$0.60 and $0.075/$0.30 per 1M tokens). llama-3.3-70b-versatile and
#     llama-3.1-8b-instant are now "Enterprise / Contact Sales" and missing from the free-plan
#     table. qwen/qwen3-32b is gone, and its successor qwen/qwen3.8-27b is preview-only.
#   https://ai.google.dev/gemini-api/docs/models and /pricing (updated 2026-10-27):
#     gemini-3.8-flash is the current stable Flash model. It is free on the free tier and costs
#     $0.75/$3.75 per 1M tokens on the paid tier until 2026-12-31.
#   Local worker: spec §7.4 default Qwen3.5-4B-MLX-4bit on vllm-metal. Start it with
#     `--served-model-name Qwen3.5-4B-MLX-4bit --enable-auto-tool-choice --tool-call-parser hermes`
#     on port 58000. The client sends a json_schema response_format by default (vLLM structured
#     outputs); the tool-call flags are only needed for `LLM(output_mode="tool")`.
#
# Rate limits are per deployment, enforced by the router before each call. Usage is counted in
# Redis (router_settings.redis_*) so every proxy worker and restart shares one budget. This
# replaces the spec's hand-written token bucket (Ruling P1). LiteLLM knows only per-minute limits.
# Daily caps (RPD/TPD) are listed for reference and surface as provider 429s, which trigger the
# fallback.

model_list:
  # strong: orchestrator / verifier ------------------------------------------------------------
  - model_name: strong
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      timeout: 30  # per attempt; see "Timeouts" under router_settings
      # Groq free plan (https://console.groq.com/docs/rate-limits, "Free Plan Limits" tab,
      # read 2026-10-28): 30 RPM, 1K RPD, 8K TPM, 200K TPD. Verify in console (/settings/limits).
      rpm: 30
      tpm: 8000
    model_info:
      allowed_fails_policy:  # hosted: tolerant, see "Cooldown" under router_settings
        RateLimitErrorAllowedFails: 3
        InternalServerErrorAllowedFails: 2
        ServiceUnavailableErrorAllowedFails: 2
        TimeoutErrorAllowedFails: 2
      cooldown_time: 30

  - model_name: strong-fallback
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
      timeout: 30  # per attempt; see "Timeouts" under router_settings
      # Google publishes free-tier limits only in AI Studio, not in its public docs
      # (https://ai.google.dev/gemini-api/docs/rate-limits points to the AI Studio page). These are
      # conservative placeholders. Verify in console (AI Studio > Rate limits) and adjust.
      rpm: 10
      tpm: 250000
    model_info:
      allowed_fails_policy:  # hosted: tolerant, see "Cooldown" under router_settings
        RateLimitErrorAllowedFails: 3
        InternalServerErrorAllowedFails: 2
        ServiceUnavailableErrorAllowedFails: 2
        TimeoutErrorAllowedFails: 2
      cooldown_time: 30

  # small: workers ------------------------------------------------------------------------------
  - model_name: small
    litellm_params:
      model: openai/Qwen3.5-4B-MLX-4bit
      api_base: http://host.docker.internal:58000/v1
      api_key: "none"  # local vLLM, no auth
      timeout: 20  # per attempt; see "Timeouts" under router_settings
      # Optional: when vLLM is not running, the connection error falls back to small-fallback.
      # No rpm/tpm here: the local server has no provider quota.
    model_info:
      # local: cool down on the FIRST failure (0 allowed fails), for 60 s, see "Cooldown" below.
      # LiteLLM reports "connection refused" as InternalServerError.
      allowed_fails_policy:
        InternalServerErrorAllowedFails: 0
        ServiceUnavailableErrorAllowedFails: 0
        TimeoutErrorAllowedFails: 0
      cooldown_time: 60

  - model_name: small-fallback
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
      timeout: 30  # per attempt; see "Timeouts" under router_settings
      # Groq free plan (same source as above): 30 RPM, 1K RPD, 8K TPM, 200K TPD.
      # Verify in console.
      rpm: 30
      tpm: 8000
    model_info:
      allowed_fails_policy:  # hosted: tolerant, see "Cooldown" under router_settings
        RateLimitErrorAllowedFails: 3
        InternalServerErrorAllowedFails: 2
        ServiceUnavailableErrorAllowedFails: 2
        TimeoutErrorAllowedFails: 2
      cooldown_time: 30

router_settings:
  routing_strategy: usage-based-routing-v2
  optional_pre_call_checks: ["enforce_model_rate_limits"]
  redis_host: redis
  redis_port: 6379
  # Timeouts (nested so a hung deployment still reaches its fallback). Each deployment sets its
  # own per-attempt `timeout` in litellm_params (LiteLLM v1.106.5 router._get_timeout: request
  # kwarg > deployment litellm_params.timeout > this router default): local `small` 20 s,
  # hosted 30 s. A timeout is not retried on the same group (TimeoutErrorRetries: 0), so it moves
  # straight to the fallback. Worst case, every attempt hanging:
  #   small:  20 x (1 + 0) + 30 x (1 + 0) = 50 s
  #   strong: 30 x (1 + 0) + 30 x (1 + 0) = 60 s
  # sluice.llm.client.REQUEST_TIMEOUT_S (90 s) must exceed both, and caps.MAX_WALL_S_PER_FILE
  # (180 s) must exceed the client timeout; tests/llm/test_litellm_config.py asserts this.
  # (One timeout retry per hosted group would make strong 30x2 + 30x2 = 120 s.)
  timeout: 30
  num_retries: 2
  # Retries (retry_policy): 429, 500 and 503 are retried up to 2 times on the SAME group (here
  # one deployment), so up to 3 attempts before the fallback; a timeout is not retried (see
  # "Timeouts" above). Bad request, auth,
  # not found, content-policy and every other error get 0 retries and go straight to the
  # fallback. The `small` group gets 0 retries for everything (model_group_retry_policy).
  #
  # Cooldown (LiteLLM v1.106.5 router_utils/cooldown_handlers.py, router.py). There is
  # deliberately NO router-wide allowed_fails or cooldown_time, so LiteLLM's defaults stay
  # (allowed_fails 3, cooldown_time 5 s). Each deployment's model_info.allowed_fails_policy
  # counts failures per exception type in Redis. The counter's TTL equals that deployment's
  # cooldown_time. A deployment cools down when a count EXCEEDS its allowance. Errors the policy
  # does not list (e.g. 401/404) fall back to the default allowance of 3, still using the
  # deployment's cooldown_time. Explicit per-exception entries also apply to single-deployment
  # groups, and to errors mentioning APIConnectionError, which the router otherwise exempts.
  # A cooled-down
  # deployment is not retried: Router.should_retry_this_error raises when no deployment is
  # healthy, and the request goes to the fallback group.
  #   - small (local vLLM): 0 allowed fails, cooldown 60 s. The first refused connection cools
  #     it down, the call falls back at once, and later calls skip it for 60 s.
  #   - hosted (strong, strong-fallback, small-fallback): cooldown 30 s.
  #     - 429: the 4th within the window. One call's 3 attempts of 429 do not eject the
  #       deployment.
  #     - 500/503/timeout: the 3rd within the window.
  #     The proxy's own rpm/tpm pre-check (enforce_model_rate_limits) raises litellm.RateLimitError
  #     and calls set_cooldown_deployments (router.async_routing_strategy_pre_call_checks), so
  #     local-limit rejections feed the SAME RateLimitError counter. They cannot be told apart in
  #     config. A cooldown triggered there lasts the router default of 5 s, because that path
  #     passes router.cooldown_time and not the deployment's. This is acceptable: a deployment
  #     rejected by its own per-minute limit has no capacity left this minute anyway.
  retry_policy:
    RateLimitErrorRetries: 2
    InternalServerErrorRetries: 2
    ServiceUnavailableErrorRetries: 2
    TimeoutErrorRetries: 0
    BadRequestErrorRetries: 0
    AuthenticationErrorRetries: 0
    NotFoundErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0
    DefaultRetries: 0
  # The local worker gets no retries. A refused connection (vLLM not running) is not worth
  # retrying, and the hosted fallback is right there. Without this, call 1 waited ~4 s in retry
  # backoff before the retry found the deployment cooled down (measured 2026-10-28).
  model_group_retry_policy:
    small:
      DefaultRetries: 0
      RateLimitErrorRetries: 0
      InternalServerErrorRetries: 0
      ServiceUnavailableErrorRetries: 0
      TimeoutErrorRetries: 0
  fallbacks:
    - strong: ["strong-fallback"]
    - small: ["small-fallback"]

litellm_settings:
  drop_params: true
  # Redis response cache keyed on model + messages + params, so eval reruns cost nothing.
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    ttl: 2592000  # 30 days
    namespace: sluice.llm
    supported_call_types: ["acompletion", "completion"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
