# LiteLLM proxy config (ghcr.io/berriai/litellm:v1.106.5), mounted by compose.yaml.
# Clients ask for a *tier* ("strong" / "small"). Each tier is a model group with one deployment;
# on failure the router walks the tier's fallback chain in order (router_settings.fallbacks):
#   strong: groq gpt-oss-120b -> strong-fallback (Gemini) -> small-fallback (Groq qwen)
#   small:  groq gpt-oss-20b  -> small-fallback (Groq qwen)
#
# Owner decisions (2026-10-29): no local vLLM for now (its deployment is kept below as a commented
# block); the Gemini key's prepaid credit is depleted (HTTP 402), so Gemini stays in the strong
# chain but a free Groq model, qwen/qwen3.8-27b, is the last resort for both tiers.
#
# Model choice (https://console.groq.com/docs/models, read 2026-10-28 and 2026-10-29):
#   production models openai/gpt-oss-120b and openai/gpt-oss-20b ($0.15/$0.60 and $0.075/$0.30 per
#   1M tokens); qwen/qwen3.8-27b is a *preview* model ("intended for evaluation purposes only",
#   $0.80/$4.00), acceptable as a last-resort fallback. All three take a json_schema
#   response_format (LiteLLM 1.106.5 supports_response_schema is true for each).
#   https://ai.google.dev/gemini-api/docs/models and /pricing (updated 2026-10-27):
#     gemini-3.8-flash is the current stable Flash model ($0.75/$3.75 per 1M tokens, paid tier).
#
# Rate limits are per deployment, enforced by the router before each call. Usage is counted in
# Redis (router_settings.redis_*) so every proxy worker and restart shares one budget. This
# replaces the spec's hand-written token bucket (Ruling P1). LiteLLM knows only per-minute limits.
# Daily caps (RPD/TPD) are listed for reference and surface as provider 429s, which trigger the
# fallback. The client (sluice.llm.client) additionally backs off and re-sends on a 429.

model_list:
  # strong: orchestrator / verifier ------------------------------------------------------------
  - model_name: strong
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      timeout: 30  # per attempt; see "Timeouts" under router_settings
      # Groq free plan, owner's console (2026-10-29): 30 RPM, 8K TPM; daily 1K RPD, 200K TPD
      # (not enforced here, they surface as provider 429s).
      rpm: 30
      tpm: 8000
    model_info:
      allowed_fails_policy:  # hosted: tolerant, see "Cooldown" under router_settings
        RateLimitErrorAllowedFails: 3
        InternalServerErrorAllowedFails: 2
        ServiceUnavailableErrorAllowedFails: 2
        TimeoutErrorAllowedFails: 2
      cooldown_time: 30

  - model_name: strong-fallback
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
      timeout: 30  # per attempt; see "Timeouts" under router_settings
      # Limits from the owner's AI Studio console (Rate limits page, checked 2026-10-29):
      # 1K RPM, 2M TPM, 10K requests/day for gemini-3.8-flash. The daily cap isn't enforced here.
      rpm: 1000
      tpm: 2000000
    model_info:
      allowed_fails_policy:  # hosted: tolerant, see "Cooldown" under router_settings
        RateLimitErrorAllowedFails: 3
        InternalServerErrorAllowedFails: 2
        ServiceUnavailableErrorAllowedFails: 2
        TimeoutErrorAllowedFails: 2
        # Prepaid credit depleted: Gemini answers 402, which LiteLLM 1.106.5 maps to
        # PaymentRequiredError (a BadRequestError; observed through this proxy 2026-10-29). It is
        # not retried in place (BadRequestErrorRetries: 0) and the router moves on to the next
        # group in the chain. 0 allowed fails cools the deployment down on the first one, so
        # later calls skip it for cooldown_time instead of paying the round trip. An explicit
        # entry also cools down on other 400s from Gemini, which is fine for a fallback.
        BadRequestErrorAllowedFails: 0
      cooldown_time: 30

  # small: workers / mapper ---------------------------------------------------------------------
  - model_name: small
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
      timeout: 30  # per attempt; see "Timeouts" under router_settings
      # Groq free plan, owner's console (2026-10-29): 30 RPM, 8K TPM; daily 1K RPD, 200K TPD.
      rpm: 30
      tpm: 8000
    model_info:
      allowed_fails_policy:  # hosted: tolerant, see "Cooldown" under router_settings
        RateLimitErrorAllowedFails: 3
        InternalServerErrorAllowedFails: 2
        ServiceUnavailableErrorAllowedFails: 2
        TimeoutErrorAllowedFails: 2
      cooldown_time: 30

  # last resort for both tiers --------------------------------------------------------------------
  - model_name: small-fallback
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/GROQ_API_KEY
      timeout: 30  # per attempt; see "Timeouts" under router_settings
      # Groq free plan, owner's console (2026-10-29): 30 RPM, 8K TPM; daily 1K RPD, 200K TPD.
      # Shared by both chains, so strong and small fallbacks draw on the same minute budget.
      rpm: 30
      tpm: 8000
    model_info:
      allowed_fails_policy:  # hosted: tolerant, see "Cooldown" under router_settings
        RateLimitErrorAllowedFails: 3
        InternalServerErrorAllowedFails: 2
        ServiceUnavailableErrorAllowedFails: 2
        TimeoutErrorAllowedFails: 2
      cooldown_time: 30

  # Local vLLM worker (disabled, owner decision 2026-10-29). To enable it:
  #   1. Start spec §7.4's default model on vllm-metal, port 58000:
  #        vllm serve <Qwen3.5-4B-MLX-4bit path> --served-model-name Qwen3.5-4B-MLX-4bit --port 58000
  #      (the client sends a json_schema response_format; add
  #      `--enable-auto-tool-choice --tool-call-parser hermes` only for LLM(output_mode="tool")).
  #   2. Uncomment this block and rename the Groq gpt-oss-20b group above from `small` to
  #      `small-remote`, then set fallbacks to `small: ["small-remote", "small-fallback"]`.
  #   3. Restore the local-worker retry policy (model_group_retry_policy.small, all retries 0) and
  #      re-check the timeout nesting in tests/llm/test_litellm_config.py.
  # - model_name: small
  #   litellm_params:
  #     model: openai/Qwen3.5-4B-MLX-4bit
  #     api_base: http://host.docker.internal:58000/v1
  #     api_key: "none"  # local vLLM, no auth
  #     timeout: 20  # per attempt
  #   model_info:
  #     # local: cool down on the FIRST failure (0 allowed fails), for 60 s. LiteLLM reports
  #     # "connection refused" as InternalServerError.
  #     allowed_fails_policy:
  #       InternalServerErrorAllowedFails: 0
  #       ServiceUnavailableErrorAllowedFails: 0
  #       TimeoutErrorAllowedFails: 0
  #     cooldown_time: 60

router_settings:
  routing_strategy: usage-based-routing-v2
  optional_pre_call_checks: ["enforce_model_rate_limits"]
  redis_host: redis
  redis_port: 6379
  # Timeouts (nested so a hung deployment still reaches its last fallback). Each deployment sets
  # its own per-attempt `timeout` in litellm_params (LiteLLM v1.106.5 router._get_timeout: request
  # kwarg > deployment litellm_params.timeout > this router default): 30 s everywhere. A timeout is
  # not retried on the same group (TimeoutErrorRetries: 0), so it moves straight to the next group
  # in the chain. Worst case, every attempt hanging:
  #   strong: 30 (120b) + 30 (Gemini) + 30 (qwen) = 90 s
  #   small:  30 (20b)  + 30 (qwen)               = 60 s
  # sluice.llm.client.REQUEST_TIMEOUT_S (120 s) must exceed both, and caps.MAX_WALL_S_PER_FILE
  # (180 s) must exceed the client timeout; tests/llm/test_litellm_config.py asserts this.
  timeout: 30
  num_retries: 2
  # Retries (retry_policy): 429, 500 and 503 are retried up to 2 times on the SAME group (here
  # one deployment), so up to 3 attempts before the next group; a timeout is not retried (see
  # "Timeouts" above). Bad request (incl. Gemini's 402 PaymentRequiredError), auth, not found,
  # content-policy and every other error get 0 retries and go straight to the next group: the
  # router's generic `fallbacks` catch any exception and try each group of the chain in order
  # (router_utils/fallback_event_handlers.run_async_fallback).
  #
  # Cooldown (LiteLLM v1.106.5 router_utils/cooldown_handlers.py, router.py). There is
  # deliberately NO router-wide allowed_fails or cooldown_time, so LiteLLM's defaults stay
  # (allowed_fails 3, cooldown_time 5 s). Each deployment's model_info.allowed_fails_policy
  # counts failures per exception type in Redis. The counter's TTL equals that deployment's
  # cooldown_time. A deployment cools down when a count EXCEEDS its allowance. Errors the policy
  # does not list (e.g. 401/404) fall back to the default allowance of 3, still using the
  # deployment's cooldown_time. Explicit per-exception entries also apply to single-deployment
  # groups, and to errors mentioning APIConnectionError, which the router otherwise exempts.
  # A cooled-down
  # deployment is not retried: Router.should_retry_this_error raises when no deployment is
  # healthy, and the request goes to the fallback group.
  #   - every deployment is hosted: cooldown 30 s.
  #     - 429: the 4th within the window. One call's 3 attempts of 429 do not eject the
  #       deployment.
  #     - 500/503/timeout: the 3rd within the window.
  #     - Gemini only: the first 400/402 (BadRequestErrorAllowedFails: 0, see its block).
  #     The proxy's own rpm/tpm pre-check (enforce_model_rate_limits) raises litellm.RateLimitError
  #     and calls set_cooldown_deployments (router.async_routing_strategy_pre_call_checks), so
  #     local-limit rejections feed the SAME RateLimitError counter. They cannot be told apart in
  #     config. A cooldown triggered there lasts the router default of 5 s, because that path
  #     passes router.cooldown_time and not the deployment's. This is acceptable: a deployment
  #     rejected by its own per-minute limit has no capacity left this minute anyway.
  retry_policy:
    RateLimitErrorRetries: 2
    InternalServerErrorRetries: 2
    ServiceUnavailableErrorRetries: 2
    TimeoutErrorRetries: 0
    BadRequestErrorRetries: 0
    AuthenticationErrorRetries: 0
    NotFoundErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0
    DefaultRetries: 0
  fallbacks:
    - strong: ["strong-fallback", "small-fallback"]
    - small: ["small-fallback"]

litellm_settings:
  drop_params: true
  # Redis response cache keyed on model + messages + params, so eval reruns cost nothing.
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    ttl: 2592000  # 30 days
    namespace: sluice.llm
    supported_call_types: ["acompletion", "completion"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
