[project]
name = "sluice"
version = "0.1.0"
description = "A self-planning agentic data pipeline."
readme = "README.md"
authors = [
    { name = "Pranav Krishna Danda", email = "pranavkrishna317@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "docker>=7.2.0",
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pandera[polars]>=0.35.0",
    "polars>=2.1.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "pydantic-ai>=2.63.0",
    "pydantic-settings>=2.16.2",
    "pyiceberg[pyarrow,sql-postgres]>=0.12.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "scipy>=1.18.1",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
sluice = "sluice.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]  # tests/: shared helpers (model_fakes)
markers = [
    "slow: long-running tests, excluded from `make test`",
    "integration: needs the Compose stack (`make up`); run with `make test-integration`",
    "live: calls real LLM providers through LiteLLM; never run by default",
]
# Default selection; a `-m` on the command line replaces it.
addopts = ["-m", "not integration and not live and not slow"]
