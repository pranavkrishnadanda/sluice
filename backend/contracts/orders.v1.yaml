# TPC-H orders, as generated by sluice.data.tpch (DuckDB dbgen) plus the derived o_ordertime.
name: orders
version: v1
locale: en_IN # source dates are written day-first
primary_key: [o_orderkey]
foreign_keys: {}
columns:
  - {name: o_orderkey, dtype: int64}
  - {name: o_custkey, dtype: int64}
  - {name: o_orderstatus, dtype: string, enum: [F, O, P]}
  - {name: o_totalprice, dtype: decimal, unit: INR, min: 0, max: 600000}
  - {name: o_orderdate, dtype: date}
  - {name: o_ordertime, dtype: timestamp_utc}
  - name: o_orderpriority
    dtype: string
    enum: [1-URGENT, 2-HIGH, 3-MEDIUM, 4-NOT SPECIFIED, 5-LOW]
  - {name: o_clerk, dtype: string}
  - {name: o_shippriority, dtype: int32}
  - {name: o_comment, dtype: string}
